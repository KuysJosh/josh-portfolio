<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="100%" stop-color="#4361ee" />
    </linearGradient>
    <linearGradient id="glowDisc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a388f" />
      <stop offset="100%" stop-color="#0d1435" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(148, 163, 184, 0.08)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Left: Mock Code Window -->
  <rect x="50" y="60" width="380" height="330" rx="16" fill="#070b16" stroke="rgba(76, 201, 240, 0.25)" stroke-width="1.5" />
  <rect x="50" y="60" width="380" height="40" rx="16" fill="#0d1527" />
  <circle cx="75" cy="80" r="5" fill="#ff5f57" />
  <circle cx="92" cy="80" r="5" fill="#febc2e" />
  <circle cx="109" cy="80" r="5" fill="#28c840" />
  <text x="135" y="84" fill="#8292aa" font-family="'JetBrains Mono', monospace" font-size="12">App.tsx — React + TypeScript</text>

  <!-- Code Lines -->
  <text x="75" y="130" fill="#4cc9f0" font-family="'JetBrains Mono', monospace" font-size="13">const Portfolio = () =&gt; {</text>
  <text x="95" y="160" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="13">const [gaze, setGaze] = useState('center');</text>
  <text x="95" y="190" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="13">const [fps] = useParallaxRig({ 60 });</text>
  <text x="95" y="225" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="13">// 23 High-res WebP interactive sprites</text>
  <text x="95" y="255" fill="#f72585" font-family="'JetBrains Mono', monospace" font-size="13">return &lt;AvatarRig tracking={true} /&gt;;</text>
  <text x="75" y="290" fill="#4cc9f0" font-family="'JetBrains Mono', monospace" font-size="13">};</text>
  <rect x="75" y="325" width="130" height="32" rx="16" fill="rgba(76, 201, 240, 0.15)" stroke="#4cc9f0" stroke-width="1"/>
  <text x="98" y="346" fill="#4cc9f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ 60 FPS LIVE</text>

  <!-- Right: 3D Disc & HUD Mockup -->
  <circle cx="610" cy="225" r="130" fill="url(#glowDisc)" stroke="rgba(76, 201, 240, 0.4)" stroke-width="2" />
  <circle cx="610" cy="225" r="150" fill="none" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" stroke-dasharray="6 6" />
  <circle cx="730" cy="140" r="7" fill="#4cc9f0" filter="drop-shadow(0 0 8px #4cc9f0)" />
  
  <!-- Silhouette / Avatar Graphic -->
  <circle cx="610" cy="180" r="42" fill="rgba(255,255,255,0.08)" stroke="#6c82ff" stroke-width="1.5" />
  <path d="M560,285 C560,235 660,235 660,285" fill="rgba(67, 97, 238, 0.3)" stroke="#4cc9f0" stroke-width="2" />

  <!-- Floating HUD Tag -->
  <rect x="520" y="300" width="180" height="50" rx="12" fill="rgba(5, 8, 20, 0.85)" stroke="rgba(76, 201, 240, 0.5)" stroke-width="1" />
  <text x="535" y="322" fill="#8292aa" font-family="'JetBrains Mono', monospace" font-size="11">gaze <tspan fill="#fff" font-weight="bold">target-locked</tspan></text>
  <text x="535" y="338" fill="#8292aa" font-family="'JetBrains Mono', monospace" font-size="11">mood <tspan fill="#10b981" font-weight="bold">active</tspan></text>
</svg>